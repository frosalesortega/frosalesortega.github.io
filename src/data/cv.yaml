- id: interests
  title: Research interests
  items:
  - body: Chemical abundances and metallicity calibrations of ionised gas.
  - body: Physical conditions and ionisation of the interstellar medium, including diffuse ionised gas.
  - body: Integral-field spectroscopy of nearby galaxies.
  - body: Galaxy chemical evolution.
  - body: Astronomical instrumentation for optical and infrared observations.
  - body: Scientific data analysis and computational methods for large spectroscopic datasets.
