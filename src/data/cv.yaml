- id: entrepreneurship
  title: Entrepreneurship
  items:
  - label: 2016–2024
    title: 'Check-Eat México: Co-founder &amp; CEO'
    body: 'Developed and brought to market <em>Check-Eat #CómeteLaFila</em>, a mobile app (iOS and Android) for remote ordering and contactless payment of food and drinks at schools, universities, stadiums and live events. Selected as one of the 100 Latin American start-ups with most potential (INCMty Acceleration, 2017); participated in national and international acceleration programmes, including Startup México Select (2018), Impact Hub (2018), Angel Ventures (2019), MassChallenge (2019) and AceleraLatam (2021). Raised private capital through the seed stage.'
  - label: 2023–present
    title: '<a href="https://eclipses.mx">eclipses.mx</a> (2023–2024) and <a href="https://iberoeclipses.com">IberoEclipses</a> (2025–present): Founder &amp; CEO'
    body: Supply and logistics of custom-branded solar-eclipse glasses certified to ISO 12312-2 for governments, schools, companies and institutions. Over 300,000 pairs distributed in Mexico for the 2023 and 2024 eclipses, including projects with the state governments of Yucatán and Sinaloa; IberoEclipses serves the Spanish market for the 2026–2028 eclipses.
