  items:
  - label: Programming
    body: Python, IDL, Shell, Perl, HTML; scientific computing; spectral analysis tools; data reduction pipelines.
  - label: Methods
    body: Integral-field spectroscopy; chemical abundance analysis.
  - label: Instrumentation
    body: Optical and infrared astronomical instrumentation (PI of the OFIUCO and FICCO instruments).
  - label: Open source
    body: <a href="https://github.com/frosalesortega/desired-calibrations">desired-calibrations</a> (public repository, <a href="https://academic.oup.com/mnras/advance-article/doi/10.1093/mnras/stag1963/8979798"><em>MNRAS</em>, 2026</a>); PINGSOFT, an IDL package for visualising and manipulating integral-field spectroscopic data (sole author, <em>New Astronomy</em>, 2011).
  - label: Open-data projects (LLM-assisted)
    body: '<a href="https://presupuesto-ciencia-mx.netlify.app/"><em>Presupuesto de CTI · México</em></a>: public dashboard, datasets and reports on Mexico’s federal science, technology and innovation budget (2012–2027), built from government open data and World Bank indicators. Developed with Claude as an LLM coding assistant; the questions, data sources and methodology are my own.'
  - label: Institutional software
    body: Developed the web reporting system of INAOE’s Astrophysics Division, later adopted as the basis of INAOE’s institution-wide reporting system.
