intro: "Además de mi investigación en astrofísica, analizo el presupuesto federal de ciencia, tecnología e innovación en México a partir de bases de datos públicas. Este trabajo es de divulgación y participación pública: es independiente de mi producción científica y no forma parte de mi lista de publicaciones."
project:
  title: "El presupuesto federal de ciencia, tecnología e innovación · México"
  url: https://presupuesto-ciencia-mx.netlify.app/
  description: "Tablero que presenta como serie continua la información presupuestaria federal en materia de ciencia, tecnología e innovación: el presupuesto aprobado de 2012 a 2027 y el efectivamente ejercido de 2015 a 2025. Su carácter es descriptivo: no evalúa programas ni atribuye responsabilidades. Desarrollado con Claude como asistente de programación; las preguntas, las fuentes de datos y la metodología son mías."
method: "Montos reales en pesos de 2020, deflactados con el INPC promedio anual. Recursos fiscales salvo indicación en contrario. Las cifras de 2027 corresponden al proyecto de presupuesto (PPEF 2027). Fuentes: Transparencia Presupuestaria (Datos Abiertos), Cuenta Pública y Banco Mundial / UNESCO. Elaboración propia."
