# Home page intro (single source of truth; the old About page is gone). [text](/path/) makes an internal link.
intro: >-
  I study the ionised gas of star-forming galaxies, its chemical abundances and physical conditions,
  mainly through integral-field spectroscopy. I also lead astronomical instrumentation projects at INAOE.
  Outside academia, I co-founded and led a technology start-up and now lead two companies supplying certified solar-eclipse glasses ([entrepreneurship](/cv/#entrepreneurship)).
  Here you can find a summary of my [research](/research/), my [publications](/publications/) and my [CV](/cv/).
researchLede: "I work on the ionised gas of galaxies and on astronomical instrumentation."
# Optional credit for the hero photograph, shown small at the bottom right of the band (leave empty for none).
heroCredit: ""
researchStatement: >-
  I study the ionised interstellar medium of star-forming galaxies: its chemical abundances,
  its physical conditions, and the role of diffuse ionised gas, mainly through integral-field
  spectroscopy and the empirical analysis of nebular emission lines. My work is empirical and
  data-intensive, relying on Python and IDL scientific computing and on data reduction pipelines.
  I also lead instrumentation projects at INAOE.
description: "Astrophysicist at INAOE, Mexico. Research on the ionised interstellar medium, chemical abundances and integral-field spectroscopy of galaxies."
