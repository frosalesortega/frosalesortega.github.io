[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public address of the site (used for canonical links, sitemap and robots.txt).
  SITE_URL = "https://frosalesortega.github.io"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
